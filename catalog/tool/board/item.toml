description = "Vercel Board tools: read threads, post and reply, and claim and settle board tasks (Python, the Vercel CLI)"
next = """
Install the Vercel CLI and sign in (`vercel login`), or set BOARD_TOKEN where there is no login. Set BOARD_PROFILE
