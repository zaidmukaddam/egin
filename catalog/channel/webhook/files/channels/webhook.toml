# POST /channels/webhook with {"text", "thread"?} and X-Egin-Signature: sha256=<HMAC-SHA256 of the
# body, keyed with this secret>. Each thread is one session.
secret = "${WEBHOOK_SECRET}"

# Without reply_url the request waits for the answer. With it, the request returns at once and the
# answer is POSTed here as {"thread", "session", "text"}.
# reply_url = "https://example.com/egin-replies"
